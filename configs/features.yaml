# Acoustic feature-extraction parameters. These are NOT dataset statistics.
# Changing anything here changes the feature values, so features must be re-extracted and the model retrained.
# (The saved model stores a hash of this file; the API warns if it no longer matches.)
audio:
  target_sample_rate: 16000      # Hz. Everything is resampled to this before feature extraction.
  min_duration_sec: 1.0          # below this: rejected
  max_duration_sec: 60.0         # above this: rejected (API protection)
  warn_duration_sec_below: 2.0   # soft warning
  clip_sample_threshold: 0.999
  clip_fraction_warn: 0.001
  near_silent_rms_dbfs_warn: -55.0
  min_voiced_fraction_warn: 0.2  # warn if few frames are voiced (pitch tracker)
  max_file_bytes: 20000000       # 20 MB upload limit
preprocessing:
  remove_dc_offset: true
  peak_normalize_to: 0.95        # makes absolute-energy features independent of microphone gain
  trim_silence: false            # leave recordings intact; silence is part of speech tasks
  noise_reduction: false         # deliberately OFF: denoising alters jitter/shimmer/HNR and is not justified here
pitch:
  floor_hz: 75.0
  ceiling_hz: 500.0
  time_step_sec: 0.01
jitter_shimmer:
  period_floor_s: 0.0001
  period_ceiling_s: 0.02
  max_period_factor: 1.3
  max_amplitude_factor: 1.6
hnr:
  time_step_sec: 0.01
  min_pitch_hz: 75.0
  silence_threshold: 0.1
  periods_per_window: 1.0
spectral:
  n_fft: 512
  hop_length: 160                # 10 ms at 16 kHz
  n_mfcc: 13
min_voiced_points_for_perturbation: 10   # fewer voiced periods than this -> jitter/shimmer reported as NaN
